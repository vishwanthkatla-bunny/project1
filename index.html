<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101426">
  <title>Hello, world!</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f5ff;
      --muted: #a9adc7;
      --violet: #a991ff;
      --cyan: #76e4de;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 16% 18%, rgba(116, 91, 228, .25), transparent 35%),
        radial-gradient(ellipse at 84% 80%, rgba(54, 195, 190, .16), transparent 34%),
        #101426;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    main {
      position: relative;
      width: min(680px, calc(100% - 40px));
      padding: clamp(34px, 7vw, 68px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,255,255,.095), rgba(255,255,255,.035));
      box-shadow: 0 30px 100px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.12);
      backdrop-filter: blur(18px);
      animation: rise .8s cubic-bezier(.2,.8,.2,1) both;
    }

    .sparkle {
      display: inline-grid;
      width: 66px;
      height: 66px;
      place-items: center;
      margin-bottom: 26px;
      border: 1px solid rgba(169,145,255,.45);
      border-radius: 20px;
      color: var(--violet);
      background: rgba(169,145,255,.12);
      font-size: 29px;
      box-shadow: 0 0 40px rgba(169,145,255,.18);
      animation: float 4s ease-in-out infinite;
    }

    .eyebrow {
      margin: 0 0 15px;
      color: var(--cyan);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    nav {
      position: fixed;
      top: 24px;
      left: 50%;
      z-index: 2;
      display: flex;
      gap: 8px;
      padding: 7px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      background: rgba(18,22,41,.72);
      backdrop-filter: blur(14px);
      transform: translateX(-50%);
    }

    nav a {
      padding: 10px 16px;
      border-radius: 999px;
      color: var(--muted);
      font-size: .88rem;
      text-decoration: none;
      transition: color .2s, background .2s;
    }

    nav a:hover, nav a[aria-current="page"] {
      color: var(--ink);
      background: rgba(255,255,255,.1);
    }

    nav a:hover, nav a[aria-current="page"] {
      color: var(--ink);
      background: rgba(255,255,255,.1);
    }

    h1 {
      margin: 0;
      font-size: clamp(3.25rem, 10vw, 6.2rem);
      line-height: .98;
      letter-spacing: -.075em;
    }

    h1 span {
      color: transparent;
      background: linear-gradient(100deg, #c5b8ff 12%, #8be9e0 90%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .intro {
      max-width: 420px;
      margin: 24px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.14rem);
      line-height: 1.7;
    }

    .rule {
      width: 54px;
      height: 3px;
      margin: 31px auto 0;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--violet), var(--cyan));
    }

    footer {
      position: fixed;
      bottom: 24px;
      color: rgba(220,223,244,.48);
      font-size: .75rem;
      letter-spacing: .08em;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-6px) rotate(3deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="index.html" aria-current="page">Home</a>
    <a href="about.html">About</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <div class="sparkle" aria-hidden="true">✦</div>
    <p class="eyebrow">A little beginning</p>
    <h1>Hello,<br><span>world!</span></h1>
    <p class="intro">A blank page, a bright idea, and a whole world of things to make. Here’s to the start of something wonderful.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
  <footer>MADE WITH A LITTLE SPARK ✦</footer>
</body>
</html>
