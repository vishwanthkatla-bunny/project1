<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101426">
  <title>Contact — Hello, world!</title>
  <style>
    :root { color-scheme: dark; --ink:#f7f5ff; --muted:#a9adc7; --violet:#a991ff; --cyan:#76e4de; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; overflow-x:hidden; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(ellipse at 16% 18%,rgba(116,91,228,.25),transparent 35%),radial-gradient(ellipse at 84% 80%,rgba(54,195,190,.16),transparent 34%),#101426; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.22; background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px); background-size:52px 52px; mask-image:linear-gradient(to bottom,black,transparent 90%); }
    nav { position:fixed; top:24px; left:50%; z-index:2; display:flex; gap:4px; padding:6px; border:1px solid rgba(255,255,255,.12); border-radius:999px; background:rgba(18,22,41,.82); backdrop-filter:blur(14px); transform:translateX(-50%); }
    nav a { padding:10px 13px; border-radius:999px; color:var(--muted); font-size:.84rem; text-decoration:none; transition:color .2s,background .2s; }
    nav a:hover,nav a[aria-current="page"] { color:var(--ink); background:rgba(255,255,255,.1); }
    main { position:relative; width:min(680px,calc(100% - 40px)); margin:90px 0 70px; padding:clamp(34px,7vw,68px); border:1px solid rgba(255,255,255,.13); border-radius:28px; background:linear-gradient(145deg,rgba(255,255,255,.095),rgba(255,255,255,.035)); box-shadow:0 30px 100px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.12); backdrop-filter:blur(18px); animation:rise .8s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { margin:0 0 15px; color:var(--cyan); font-size:.75rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(3rem,9vw,5.3rem); line-height:1; letter-spacing:-.075em; }
    h1 span { color:transparent; background:linear-gradient(100deg,#c5b8ff 12%,#8be9e0 90%); background-clip:text; -webkit-background-clip:text; }
    .intro { max-width:510px; margin:24px 0 0; color:var(--muted); font-size:1.08rem; line-height:1.8; }
    .contact-link { display:inline-flex; align-items:center; gap:10px; margin-top:30px; padding:14px 20px; border:1px solid rgba(139,233,224,.4); border-radius:999px; color:#101426; background:linear-gradient(100deg,#c5b8ff,#8be9e0); font-weight:700; text-decoration:none; transition:transform .2s,box-shadow .2s; }
    .contact-link:hover { transform:translateY(-2px); box-shadow:0 10px 32px rgba(118,228,222,.2); }
    .rule { width:54px; height:3px; margin:30px 0 0; border-radius:3px; background:linear-gradient(90deg,var(--violet),var(--cyan)); }
    footer { position:fixed; bottom:24px; color:rgba(220,223,244,.48); font-size:.75rem; letter-spacing:.08em; }
    @keyframes rise { from{opacity:0;transform:translateY(18px) scale(.985)} to{opacity:1;transform:translateY(0) scale(1)} }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>
  <main>
    <p class="eyebrow">Say hello</p>
    <h1>Let’s make<br><span>something.</span></h1>
    <p class="intro">Have an idea, a question, or just want to say hi? I’d love to hear from you. Start a conversation and let’s see where it goes.</p>
    <a class="contact-link" href="mailto:hello@example.com">✉&nbsp; Send an email</a>
    <div class="rule" aria-hidden="true"></div>
  </main>
  <footer>MADE WITH A LITTLE SPARK ✦</footer>
</body>
</html>
